name: docker-build-autotag

on:
  workflow_call:
    inputs:
      context:
        type: string
        default: "."
      file:
        type: string
        default: "Dockerfile"
      platforms:
        type: string
        default: "linux/amd64,linux/arm64"
      image_name:
        type: string
        required: true
      app_client_id:
        type: string
        required: false
        default: ""
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate token with GitHub App (e.g. connector-reader)
        id: app-token
        if: inputs.app_client_id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.file }}
          secrets: |
            private_repo_token=${{ steps.app-token.outputs.token || secrets.PRIVATE_REPO_TOKEN }}

  cleanup:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write
    steps:
      - name: Delete old untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ inputs.image_name }} 
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 30
